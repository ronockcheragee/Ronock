<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RONOCK</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/JRrxsJps/image.png">
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
-webkit-tap-highlight-color: transparent;
}

body {
background-color: #f4f6f8;
display: flex;
flex-direction: column;
min-height: 100vh;
user-select: none;
-webkit-user-select: none;
}

#login-screen {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: #16a085;
display: flex;
justify-content: center;
align-items: center;
z-index: 99999;
}

.login-box {
background: white;
padding: 30px 25px;
border-radius: 12px;
box-shadow: 0 8px 24px rgba(0,0,0,0.25);
width: 90%;
max-width: 350px;
text-align: center;
}

.login-box h2 {
color: #1abc9c;
margin-bottom: 8px;
font-size: 22px;
font-weight: bold;
}

.login-box p {
color: #7f8c8d;
font-size: 13px;
margin-bottom: 20px;
}

.input-field {
width: 100%;
padding: 12px;
margin-bottom: 12px;
border: 1px solid #bdc3c7;
border-radius: 6px;
font-size: 14px;
outline: none;
}

.input-field:focus {
border-color: #1abc9c;
}

.login-btn {
width: 100%;
padding: 12px;
background: #1abc9c;
color: white;
border: none;
border-radius: 6px;
font-size: 15px;
font-weight: bold;
cursor: pointer;
}

.login-btn:hover {
background: #16a085;
}

.error-msg {
color: #e74c3c;
font-size: 12px;
margin-bottom: 10px;
display: none;
}

.top-header {
background-color: #1abc9c;
color: white;
padding: 15px;
display: flex;
justify-content: space-between;
align-items: center;
}

.logo {
font-size: 20px;
font-weight: bold;
}

.status-badge {
font-size: 11px;
background: #16a085;
padding: 4px 8px;
border-radius: 12px;
}

.logout-btn {
background: #e74c3c;
color: white;
border: none;
padding: 5px 12px;
border-radius: 12px;
font-size: 11px;
font-weight: bold;
cursor: pointer;
margin-left: 8px;
}

.menu-bar {
background-color: #16a085;
display: flex;
overflow-x: auto;
padding: 10px 5px;
align-items: center;
}

.menu-item {
color: white;
text-decoration: none;
padding: 8px 14px;
white-space: nowrap;
font-size: 13px;
border-radius: 4px;
margin-right: 5px;
cursor: pointer;
}

.menu-item.active {
background-color: #f39c12;
font-weight: bold;
}

.action-bar {
display: flex;
justify-content: space-between;
align-items: center;
padding: 12px 15px;
background-color: #e0f2f1;
min-height: 55px;
flex-wrap: wrap;
gap: 10px;
}

.btn {
padding: 8px 14px;
border: none;
border-radius: 4px;
font-weight: bold;
cursor: pointer;
font-size: 13px;
}

.btn-import {
background-color: #1abc9c;
color: white;
display: inline-block;
}

.btn-create-note {
background-color: #f39c12;
color: white;
margin-left: 8px;
display: none;
}

.btn-download {
background-color: #3498db;
color: white;
}

.btn-delete {
background-color: #e74c3c;
color: white;
margin-left: 5px;
}

.btn-cancel {
background-color: #7f8c8d;
color: white;
margin-left: 5px;
}

.btn-select-all {
background-color: #9b59b6;
color: white;
margin-left: 5px;
}

.btn-secret-action {
background-color: #8e44ad;
color: white;
margin-left: 5px;
display: none;
}

.main-container {
padding: 15px;
flex: 1;
}

.grid-layout {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
gap: 15px;
}

.card {
background: white;
border-radius: 8px;
padding: 8px;
box-shadow: 0 2px 5px rgba(0,0,0,0.1);
position: relative;
text-align: center;
cursor: pointer;
border: 2px solid transparent;
transition: all 0.2s ease;
}

.card.selected {
border: 2px solid #3498db;
background-color: #ebf5fb;
}

.checkbox-circle {
position: absolute;
top: 10px;
left: 10px;
width: 22px;
height: 22px;
border-radius: 50%;
border: 2px solid #bdc3c7;
background: rgba(255, 255, 255, 0.8);
display: none;
align-items: center;
justify-content: center;
z-index: 5;
}

.selection-mode .checkbox-circle {
display: flex;
}

.card.selected .checkbox-circle {
background: #3498db;
border-color: #3498db;
}

.card.selected .checkbox-circle::after {
content: '✓';
color: white;
font-size: 14px;
font-weight: bold;
}

.preview-box {
width: 100%;
height: 110px;
background-color: #1a1a1a;
border-radius: 6px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
margin-bottom: 8px;
overflow: hidden;
font-size: 30px;
position: relative;
}

.preview-box img {
width: 100%;
height: 100%;
object-fit: cover;
pointer-events: none;
}

.video-thumb-container {
width: 100%;
height: 100%;
position: relative;
display: flex;
align-items: center;
justify-content: center;
background: #000;
}

.video-thumb-container img {
width: 100%;
height: 100%;
object-fit: cover;
position: absolute;
top: 0;
left: 0;
opacity: 0.85;
}

.play-icon {
font-size: 24px;
background: rgba(0, 0, 0, 0.6);
width: 36px;
height: 36px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
border: 2px solid white;
color: white;
z-index: 2;
}

.audio-preview {
width: 100%;
padding: 5px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 5px;
}

.audio-preview audio {
width: 100%;
height: 35px;
}

.note-card-preview {
font-size: 11px;
color: #555;
text-align: left;
padding: 8px;
width: 100%;
height: 100%;
background: #fffde7;
border: 1px solid #fff59d;
border-radius: 4px;
overflow: hidden;
word-break: break-word;
}

.card-title-container {
display: flex;
align-items: center;
justify-content: space-between;
gap: 4px;
}

.card-title {
font-size: 12px;
color: #333;
word-break: break-all;
height: 16px;
overflow: hidden;
font-weight: bold;
flex: 1;
text-align: left;
}

.rename-icon {
font-size: 11px;
cursor: pointer;
color: #7f8c8d;
padding: 2px;
}

.rename-icon:hover {
color: #3498db;
}

.gallery-modal {
display: none;
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: #000000;
z-index: 2000;
flex-direction: column;
justify-content: space-between;
}

.gallery-top-bar {
display: flex;
justify-content: space-between;
align-items: center;
padding: 12px 16px;
background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0));
color: white;
z-index: 10;
}

.gallery-back-btn {
background: none;
border: none;
color: white;
font-size: 24px;
cursor: pointer;
padding: 4px 8px;
display: flex;
align-items: center;
justify-content: center;
}

.gallery-title {
font-size: 14px;
max-width: 50%;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
font-weight: 500;
}

.gallery-right-actions {
display: flex;
align-items: center;
gap: 12px;
}

.gallery-action-btn {
background: none;
border: none;
color: white;
font-size: 20px;
cursor: pointer;
padding: 4px;
}

.gallery-viewer-body {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
position: relative;
overflow: hidden;
width: 100%;
height: 100%;
}

.gallery-viewer-body img, 
.gallery-viewer-body video {
max-width: 100%;
max-height: 100%;
object-fit: contain;
}

.gallery-nav-btn {
position: absolute;
top: 50%;
transform: translateY(-50%);
background: rgba(255, 255, 255, 0.2);
color: white;
border: none;
width: 45px;
height: 45px;
border-radius: 50%;
font-size: 20px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
z-index: 5;
transition: background 0.2s;
}

.gallery-nav-btn:hover {
background: rgba(255, 255, 255, 0.4);
}

.gallery-prev {
left: 15px;
}

.gallery-next {
right: 15px;
}

.modal {
display: none;
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.85);
z-index: 2500;
justify-content: center;
align-items: center;
}

.modal-content-box {
background: white;
border-radius: 12px;
padding: 20px;
width: 90%;
max-width: 400px;
text-align: center;
position: relative;
box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.modal-content-box h3 {
margin-bottom: 12px;
color: #2c3e50;
font-size: 18px;
}

.modal-content-box p {
font-size: 13px;
color: #7f8c8d;
margin-bottom: 15px;
line-height: 1.5;
}

.info-details-list {
text-align: left;
font-size: 13px;
color: #333;
background: #f8f9fa;
padding: 12px;
border-radius: 8px;
margin-bottom: 15px;
word-break: break-all;
}

.info-details-list div {
margin-bottom: 8px;
}

.info-details-list strong {
color: #1abc9c;
}

.note-modal-content {
background: #fffbf0;
border-radius: 12px;
width: 92%;
max-width: 550px;
padding: 0;
overflow: hidden;
box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}

.note-modal-header {
background: #f7f1e3;
padding: 12px 18px;
display: flex;
justify-content: space-between;
align-items: center;
border-bottom: 1px solid #eccc68;
}

.note-modal-body {
padding: 15px;
display: flex;
flex-direction: column;
gap: 10px;
}

.note-title-input {
width: 100%;
border: none;
background: transparent;
font-size: 18px;
font-weight: bold;
outline: none;
color: #2c3e50;
border-bottom: 1px solid #e0e0e0;
padding-bottom: 8px;
}

.note-textarea {
width: 100%;
height: 250px;
border: none;
background: transparent;
font-size: 15px;
outline: none;
resize: none;
color: #333;
line-height: 1.6;
}

.loader {
font-size: 14px;
color: #7f8c8d;
text-align: center;
margin-top: 50px;
}
</style>
</head>
<body>

<div id="login-screen">
<div class="login-box">
<h2>RONOCK CHERAGEE</h2>
<p>SCHOOL MEMORIES</p>
<div id="login-error" class="error-msg">Incorrect Username or Password!</div>
<input type="text" id="username-input" class="input-field" placeholder="Username" autocomplete="off" autocapitalize="off">
<input type="password" id="password-input" class="input-field" placeholder="Password" autocomplete="off">
<button class="login-btn" onclick="handleLogin()">Unlock Vault</button>
</div>
</div>

<div id="app-content" style="display: none;">
<div class="top-header">
<div class="logo">RONOCK</div>
<div>
<span class="status-badge" id="sync-status">Cloud Sync Active ☁️</span>
<button class="logout-btn" onclick="handleLogout()">Logout 🔒</button>
</div>
</div>

<div class="menu-bar">
<div class="menu-item active" onclick="switchCategory('all', this)">Dashboard</div>
<div class="menu-item" onclick="switchCategory('image', this)">Picture</div>
<div class="menu-item" onclick="switchCategory('video', this)">Video</div>
<div class="menu-item" onclick="switchCategory('audio', this)">Voice</div>
<div class="menu-item" onclick="switchCategory('text', this)">Text</div>
<div class="menu-item" onclick="switchCategory('secret', this)">🔑 Secret</div>
</div>

<div id="normal-actions">
