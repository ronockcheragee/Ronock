<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RONOCK Memory Vault</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f4f6f8;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Strict Login Screen Styles */
    #login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #16a085;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }

    .login-box {
      background: white;
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      width: 90%;
      max-width: 350px;
      text-align: center;
    }

    .login-box h2 {
      color: #1abc9c;
      margin-bottom: 8px;
      font-size: 22px;
      font-weight: bold;
    }

    .login-box p {
      color: #7f8c8d;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .input-field {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #bdc3c7;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .input-field:focus {
      border-color: #1abc9c;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: #1abc9c;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #16a085;
    }

    .error-msg {
      color: #e74c3c;
      font-size: 12px;
      margin-bottom: 10px;
      display: none;
    }

    /* Vault Interface Styles */
    .top-header {
      background-color: #1abc9c;
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .status-badge {
      font-size: 11px;
      background: #16a085;
      padding: 4px 8px;
      border-radius: 12px;
    }

    .logout-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 8px;
    }

    .menu-bar {
      background-color: #16a085;
      display: flex;
      overflow-x: auto;
      padding: 10px 5px;
    }

    .menu-item {
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      white-space: nowrap;
      font-size: 14px;
      border-radius: 4px;
      margin-right: 5px;
      cursor: pointer;
    }

    .menu-item.active {
      background-color: #f39c12;
      font-weight: bold;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background-color: #e0f2f1;
      min-height: 55px;
    }

    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-import {
      background-color: #1abc9c;
      color: white;
      display: inline-block;
    }

    .btn-create-note {
      background-color: #f39c12;
      color: white;
      margin-left: 8px;
      display: none;
    }

    .btn-download {
      background-color: #3498db;
      color: white;
    }

    .btn-delete {
      background-color: #e74c3c;
      color: white;
      margin-left: 5px;
    }

    .btn-cancel {
      background-color: #7f8c8d;
      color: white;
      margin-left: 5px;
    }

    .main-container {
      padding: 15px;
      flex: 1;
    }

    .grid-layout {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: relative;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .card.selected {
      border: 2px solid #3498db;
      background-color: #ebf5fb;
    }

    .checkbox-circle {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #bdc3c7;
      background: rgba(255, 255, 255, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .selection-mode .checkbox-circle {
      display: flex;
    }

    .card.selected .checkbox-circle {
      background: #3498db;
      border-color: #3498db;
    }

    .card.selected .checkbox-circle::after {
      content: '✓';
      color: white;
      font-size: 14px;
      font-weight: bold;
    }

    .preview-box {
      width: 100%;
      height: 110px;
      background-color: #f0f0f0;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      overflow: hidden;
      font-size: 30px;
      position: relative;
    }

    .preview-box img, .preview-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .note-card-preview {
      font-size: 11px;
      color: #555;
      text-align: left;
      padding: 8px;
      width: 100%;
      height: 100%;
      background: #fffde7;
      border: 1px solid #fff59d;
      border-radius: 4px;
      overflow: hidden;
      word-break: break-word;
    }

    .card-title {
      font-size: 12px;
      color: #333;
      word-break: break-all;
      height: 16px;
      overflow: hidden;
      font-weight: bold;
    }

    .play-toggle-btn {
      background: #1abc9c;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      width: 90%;
      max-width: 500px;
      border-radius: 8px;
      padding: 15px;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }

    .close-btn {
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 10px;
    }

    .modal-body {
      text-align: center;
      max-height: 70vh;
      overflow-y: auto;
    }

    .note-modal-content {
      background: #fffbf0;
      border-radius: 12px;
      width: 92%;
      max-width: 550px;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .note-modal-header {
      background: #f7f1e3;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eccc68;
    }

    .note-modal-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .note-title-input {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 18px;
      font-weight: bold;
      outline: none;
      color: #2c3e50;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 8px;
    }

    .note-textarea {
      width: 100%;
      height: 250px;
      border: none;
      background: transparent;
      font-size: 15px;
      outline: none;
      resize: none;
      color: #333;
      line-height: 1.6;
    }

    .loader {
      font-size: 14px;
      color: #7f8c8d;
      text-align: center;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <!-- Strict Login Screen -->
  <div id="login-screen">
    <div class="login-box">
      <h2>RONOCK VAULT</h2>
      <p>Protected Vault Access</p>
      <div id="login-error" class="error-msg">Incorrect Username or Password!</div>
      <input type="text" id="username-input" class="input-field" placeholder="Username" autocomplete="off">
      <input type="password" id="password-input" class="input-field" placeholder="Password" autocomplete="off">
      <button class="login-btn" onclick="handleLogin()">Unlock Vault</button>
    </div>
  </div>

  <!-- Dashboard View (Locked until correct login) -->
  <div id="app-content" style="display: none;">
    <div class="top-header">
      <div class="logo">RONOCK</div>
      <div>
        <span class="status-badge" id="sync-status">Cloud Sync Active ☁️</span>
        <button class="logout-btn" onclick="handleLogout()">Logout 🔒</button>
      </div>
    </div>

    <div class="menu-bar">
      <div class="menu-item active" onclick="switchCategory('all', this)">Dashboard</div>
      <div class="menu-item" onclick="switchCategory('image', this)">Picture</div>
      <div class="menu-item" onclick="switchCategory('video', this)">Video</div>
      <div class="menu-item" onclick="switchCategory('audio', this)">Voice</div>
      <div class="menu-item" onclick="switchCategory('text', this)">Text</div>
    </div>

    <div class="action-bar">
      <div id="normal-actions">
        <label for="file-import" class="btn btn-import">+ Import File</label>
        <input type="file" id="file-import" multiple style="display: none;" onchange="handleMultipleImport(event)">
        <button class="btn btn-create-note" id="create-note-btn" onclick="openNoteEditor()">+ Write Note</button>
      </div>

      <div id="selection-actions" style="display: none; width: 100%;">
        <span id="selected-count" style="font-weight: bold; font-size: 14px; color: #2c3e50;">Selected: 0</span>
        <div style="float: right;">
          <button class="btn btn-download" onclick="downloadSelectedFiles()">Download</button>
          <button class="btn btn-delete" onclick="deleteSelected()">Delete</button>
          <button class="btn btn-cancel" onclick="exitSelectionMode()">Cancel</button>
        </div>
      </div>
    </div>

    <div class="main-container">
      <div class="grid-layout" id="media-grid">
        <div class="loader">Loading cloud files...</div>
      </div>
    </div>
  </div>

  <!-- Standard Media Modal -->
  <div id="media-modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h4 id="modal-title" style="font-size: 14px;">File View</h4>
        <div>
          <button id="modal-dl-btn" class="btn btn-download">Save</button>
          <span class="close-btn" onclick="closeModal()">&times;</span>
        </div>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Samsung Note Pad Modal -->
  <div id="note-modal" class="modal" onclick="closeNoteModal()">
    <div class="note-modal-content" onclick="event.stopPropagation()">
      <div class="note-modal-header">
        <span style="font-weight: bold; color: #84817a; font-size: 14px;">Samsung Note Pad</span>
        <div>
          <button class="btn btn-import" onclick="saveNote()">Save Note</button>
          <span class="close-btn" onclick="closeNoteModal()">&times;</span>
        </div>
      </div>
      <div class="note-modal-body">
        <input type="text" id="note-title" class="note-title-input" placeholder="Title...">
        <textarea id="note-content" class="note-textarea" placeholder="Start typing your note here..."></textarea>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Standard Credentials
    const DEFAULT_USERNAME = "ronock";
    const DEFAULT_PASSWORD = "1234";

    // Strictly ensure session is NOT saved across tab/browser exits
    window.handleLogin = function() {
      const u = document.getElementById('username-input').value.trim();
      const p = document.getElementById('password-input').value.trim();
      
      if (u === DEFAULT_USERNAME && p === DEFAULT_PASSWORD) {
        // Use sessionStorage: Clears automatically as soon as tab/browser closes or refreshes
        sessionStorage.setItem('ronock_active_session', 'true');
        showVaultAndInitFirebase();
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    };

    window.handleLogout = function() {
      sessionStorage.removeItem('ronock_active_session');
      location.reload();
    };

    // Auto logout when page is closed/refreshed
    window.addEventListener('beforeunload', () => {
      sessionStorage.removeItem('ronock_active_session');
    });

    const firebaseConfig = {
      apiKey: "AiZaSyC8lXOMiVERVibJAsVOu-31F...",
      authDomain: "my-memory-vault-630b3.firebaseapp.com",
      databaseURL: "https://my-memory-vault-630b3-default-rtdb.firebaseio.com",
      projectId: "my-memory-vault-630b3",
      storageBucket: "my-memory-vault-630b3.appspot.com",
      messagingSenderId: "31545523452",
      appId: "1:31545523452:web:aadaa50f7a7571c8beeb79",
      measurementId: "G-QMBXSZD2EV"
    };

    let db = null;
    let memoriesRef = null;

    function showVaultAndInitFirebase() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-content').style.display = 'block';

      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      memoriesRef = collection(db, "memories");

      onSnapshot(memoriesRef, (snapshot) => {
        window.vaultItems = snapshot.docs.map(doc => ({
          docId: doc.id,
          ...doc.data()
        }));
        document.getElementById('sync-status').innerText = "Cloud Sync Active ☁️";
        renderGrid();
      }, (error) => {
        document.getElementById('sync-status').innerText = "Offline Mode ⚠️";
      });
    }

    // Force clear session on initial load
    sessionStorage.removeItem('ronock_active_session');

    window.vaultItems = [];
    window.selectedItemIds = [];
    window.currentCategory = 'all';
    window.isSelectionMode = false;
    window.holdTimer = null;
    window.audioElements = {};
    window.editingNoteDocId = null;

    const fileToBase64 = (file) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });

    window.handleMultipleImport = async function(event) {
      const files = event.target.files;
      if (!files || files.length === 0 || !memoriesRef) return;

      document.getElementById('sync-status').innerText = "Processing & Uploading... ⏳";

      for (const file of Array.from(files)) {
        let fileCategory = 'text';
        if (file.type.startsWith('image/')) fileCategory = 'image';
        else if (file.type.startsWith('video/')) fileCategory = 'video';
        else if (file.type.startsWith('audio/')) fileCategory = 'audio';

        try {
          const base64Data = await fileToBase64(file);

          await addDoc(memoriesRef, {
            id: Date.now() + Math.random(),
            name: file.name,
            url: base64Data,
            type: file.type,
            category: fileCategory,
            textContent: '',
            isPlaying: false,
            createdAt: new Date().toISOString()
          });
        } catch(err) {
          alert("File import failed: " + err.message);
        }
      }

      document.getElementById('sync-status').innerText = "Cloud Sync Active ☁️";
      event.target.value = '';
    };

    window.saveNote = async function() {
      if(!memoriesRef) return;
      const title = document.getElementById('note-title').value.trim() || 'Untitled Note';
      const content = document.getElementById('note-content').value;

      try {
        if (window.editingNoteDocId) {
          const docRef = doc(db, "memories", window.editingNoteDocId);
          await updateDoc(docRef, {
            name: title + '.txt',
            textContent: content
          });
        } else {
          await addDoc(memoriesRef, {
            id: Date.now() + Math.random(),
            name: title + '.txt',
            url: '',
            type: 'text/plain',
            category: 'text',
            textContent: content,
            isPlaying: false,
            createdAt: new Date().toISOString()
          });
        }
        closeNoteModal();
      } catch(err) {
        alert("Failed to save note: " + err.message);
      }
    };

    window.deleteSelected = async function() {
      if(!db) return;
      const selectedDocs = window.vaultItems.filter(item => window.selectedItemIds.includes(item.id));
      for (const item of selectedDocs) {
        if (item.docId) {
          await deleteDoc(doc(db, "memories", item.docId));
        }
      }
      window.selectedItemIds = [];
      window.isSelectionMode = false;
      renderGrid();
    };

    window.switchCategory = function(category, element) {
      window.currentCategory = category;
      document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');

      const createNoteBtn = document.getElementById('create-note-btn');
      if (category === 'text') {
        createNoteBtn.style.display = 'inline-block';
      } else {
        createNoteBtn.style.display = 'none';
      }

      renderGrid();
    };

    window.renderGrid = function() {
      const grid = document.getElementById('media-grid');
      grid.innerHTML = '';

      if (window.isSelectionMode) {
        grid.classList.add('selection-mode');
      } else {
        grid.classList.remove('selection-mode');
      }

      const filteredItems = window.currentCategory === 'all' 
        ? window.vaultItems 
        : window.vaultItems.filter(item => item.category === window.currentCategory);

      if(filteredItems.length === 0) {
        grid.innerHTML = `<div class="loader">No items in ${window.currentCategory} category yet.</div>`;
        updateActionBar();
        return;
      }

      filteredItems.forEach(item => {
        const card = document.createElement('div');
        const isSelected = window.selectedItemIds.includes(item.id);
        card.className = `card ${isSelected ? 'selected' : ''}`;

        let previewHTML = '';
        if (item.category === 'image') {
          previewHTML = `<img src="${item.url}">`;
        } else if (item.category === 'video') {
          previewHTML = `<video src="${item.url}"></video>`;
        } else if (item.category === 'audio') {
          previewHTML = `🎙️ <button class="play-toggle-btn" onclick="event.stopPropagation(); toggleAudio(${item.id})">${item.isPlaying ? 'Pause ⏸' : 'Play ▶'}</button>`;
        } else {
          const textPreview = item.textContent ? item.textContent : 'Text Document';
          previewHTML = `<div class="note-card-preview">${textPreview}</div>`;
        }

        card.innerHTML = `
          <div class="checkbox-circle"></div>
          <div class="preview-box">${previewHTML}</div>
          <div class="card-title">${item.name}</div>
        `;

        const startHold = () => {
          window.holdTimer = setTimeout(() => {
            if (!window.isSelectionMode) {
              window.isSelectionMode = true;
              toggleSelectItem(item.id);
            }
          }, 3000);
        };

        const clearHold = () => {
          if (window.holdTimer) clearTimeout(window.holdTimer);
        };

        card.addEventListener('touchstart', startHold, { passive: true });
        card.addEventListener('touchend', clearHold);
        card.addEventListener('touchmove', clearHold);

        card.addEventListener('mousedown', startHold);
        card.addEventListener('mouseup', clearHold);
        card.addEventListener('mouseleave', clearHold);

        card.addEventListener('click', () => {
          if (window.isSelectionMode) {
            toggleSelectItem(item.id);
          } else {
            handleSingleTap(item);
          }
        });

        grid.appendChild(card);
      });

      updateActionBar();
    };

    window.openNoteEditor = function(noteItem = null) {
      if (noteItem) {
        window.editingNoteDocId = noteItem.docId;
        document.getElementById('note-title').value = noteItem.name.replace('.txt', '');
        document.getElementById('note-content').value = noteItem.textContent;
      } else {
        window.editingNoteDocId = null;
        document.getElementById('note-title').value = '';
        document.getElementById('note-content').value = '';
      }
      document.getElementById('note-modal').style.display = 'flex';
    };

    window.closeNoteModal = function() {
      document.getElementById('note-modal').style.display = 'none';
    };

    window.toggleSelectItem = function(id) {
      if (window.selectedItemIds.includes(id)) {
        window.selectedItemIds = window.selectedItemIds.filter(itemId => itemId !== id);
      } else {
        window.selectedItemIds.push(id);
      }
      renderGrid();
    };

    window.exitSelectionMode = function() {
      window.isSelectionMode = false;
      window.selectedItemIds = [];
      renderGrid();
    };

    window.toggleAudio = function(id) {
      const item = window.vaultItems.find(i => i.id === id);
      if (!item) return;

      if (!window.audioElements[id]) {
        window.audioElements[id] = new Audio(item.url);
        window.audioElements[id].onended = () => {
          item.isPlaying = false;
          renderGrid();
        };
      }

      const audio = window.audioElements[id];
      if (item.isPlaying) {
        audio.pause();
        item.isPlaying = false;
      } else {
        Object.keys(window.audioElements).forEach(k => {
          window.audioElements[k].pause();
          const target = window.vaultItems.find(i => i.id == k);
          if (target) target.isPlaying = false;
        });

        audio.play();
        item.isPlaying = true;
      }
      renderGrid();
    };

    window.handleSingleTap = function(item) {
      if (item.category === 'audio') {
        toggleAudio(item.id);
      } else if (item.category === 'text') {
        openNoteEditor(item);
      } else if (item.category === 'image') {
        openModal(`<img src="${item.url}" style="max-width:100%; max-height:60vh;">`, item.name, item);
      } else if (item.category === 'video') {
        openModal(`<video src="${item.url}" controls autoplay style="max-width:100%; max-height:60vh;"></video>`, item.name, item);
      }
    };

    window.downloadSingleItem = function(item) {
      const a = document.createElement('a');
      a.href = item.url;
      a.download = item.name;
      a.target = "_blank";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };

    window.downloadSelectedFiles = function() {
      window.vaultItems.filter(item => window.selectedItemIds.includes(item.id)).forEach(item => {
        downloadSingleItem(item);
      });
    };

    window.updateActionBar = function() {
      const normalActions = document.getElementById('normal-actions');
      const selectionActions = document.getElementById('selection-actions');
      const countText = document.getElementById('selected-count');

      if (window.isSelectionMode) {
        normalActions.style.display = 'none';
        selectionActions.style.display = 'block';
        countText.innerText = `Selected: ${window.selectedItemIds.length}`;
      } else {
        normalActions.style.display = 'block';
        selectionActions.style.display = 'none';
      }
    };

    window.openModal = function(contentHTML, title, item) {
      document.getElementById('modal-title').innerText = title;
      const dlBtn = document.getElementById('modal-dl-btn');
      dlBtn.onclick = () => downloadSingleItem(item);

      document.getElementById('modal-body').innerHTML = contentHTML;
      document.getElementById('media-modal').style.display = 'flex';
    };

    window.closeModal = function() {
      const modalBody = document.getElementById('modal-body');
      const video = modalBody.querySelector('video');
      if (video) video.pause();

      document.getElementById('media-modal').style.display = 'none';
    };
  </script>
</body>
</html>
